name: PlainSky

options:
  bundleIdPrefix: com.columbuslabs
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
    DEVELOPMENT_TEAM: 78PXX669LQ

targets:
  PlainSky:
    type: application
    platform: iOS
    sources:
      - path: PlainSky
        excludes:
          - Info.plist
    info:
      path: PlainSky/Info.plist
      properties:
        CFBundleDisplayName: PlainSky
        CFBundleName: PlainSky
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        NSLocationWhenInUseUsageDescription: Your location is used to show weather for where you are. If weather alerts are on, an approximate location (about 1 km) is stored only to send you alerts.
        UIUserInterfaceStyle: Light
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.columbuslabs.weatherapp.refresh
    dependencies:
      - target: PlainSkyWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.columbuslabs.weatherapp
        PRODUCT_NAME: PlainSky
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: PlainSky/PlainSky.entitlements
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      gatherCoverageData: true
      testTargets:
        - PlainSkyTests

  PlainSkyWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: PlainSkyWidget
        excludes:
          - Info.plist
      # The widget reuses the app's validated NWS pipeline and models.
      - path: PlainSky/Core
        excludes:
          - Navigation/InteractivePopGesture.swift
      - path: PlainSky/Features/Radar/RadarPlaybackState.swift
    info:
      path: PlainSkyWidget/Info.plist
      properties:
        CFBundleDisplayName: PlainSky
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.columbuslabs.weatherapp.widget
        PRODUCT_NAME: PlainSkyWidget
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: PlainSkyWidget/PlainSkyWidget.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES

  PlainSkyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PlainSkyTests
    dependencies:
      - target: PlainSky
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.columbuslabs.plainsky.tests
        GENERATE_INFOPLIST_FILE: YES
