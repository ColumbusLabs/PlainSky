name: PlainSky

options:
  bundleIdPrefix: com.columbuslabs
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
    DEVELOPMENT_TEAM: 78PXX669LQ

targets:
  PlainSky:
    type: application
    platform: iOS
    sources:
      - path: PlainSky
        excludes:
          - Info.plist
    info:
      path: PlainSky/Info.plist
      properties:
        CFBundleDisplayName: PlainSky
        CFBundleName: PlainSky
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        NSLocationWhenInUseUsageDescription: Your location is used to show weather for where you are. Your location is not stored on our servers.
        UIUserInterfaceStyle: Light
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.columbuslabs.weatherapp
        PRODUCT_NAME: PlainSky
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: PlainSky/PlainSky.entitlements
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      gatherCoverageData: true
      testTargets:
        - PlainSkyTests

  PlainSkyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PlainSkyTests
    dependencies:
      - target: PlainSky
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.columbuslabs.plainsky.tests
        GENERATE_INFOPLIST_FILE: YES
