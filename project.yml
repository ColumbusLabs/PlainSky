name: WeatherApp

options:
  bundleIdPrefix: com.columbuslabs
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0

targets:
  WeatherApp:
    type: application
    platform: iOS
    sources:
      - path: WeatherApp
        excludes:
          - Info.plist
          - Resources
    resources:
      - path: WeatherApp/Resources
    info:
      path: WeatherApp/Info.plist
      properties:
        CFBundleDisplayName: Weather
        CFBundleName: Weather
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        NSLocationWhenInUseUsageDescription: Your location is used to show weather for where you are. Your location is not stored on our servers.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.columbuslabs.weatherapp
        PRODUCT_NAME: WeatherApp
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      gatherCoverageData: true
      testTargets:
        - WeatherAppTests

  WeatherAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WeatherAppTests
    dependencies:
      - target: WeatherApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.columbuslabs.weatherapp.tests
        GENERATE_INFOPLIST_FILE: YES
