name: iOS Build\n\non:\n  push:\n    branches:\n      - main\n      - "feat/**"\n  pull_request:\n\njobs:\n  build:\n    runs-on: macos-latest\n    steps:\n      - uses: actions/checkout@v4\n\n      - name: Install XcodeGen\n        run: brew install xcodegen\n\n      - name: Generate Xcode project\n        run: xcodegen generate\n\n      - name: Build app\n        run: |\n          xcodebuild \\n            -project WeatherApp.xcodeproj \\n            -scheme WeatherApp \\n            -configuration Debug \\n            -sdk iphonesimulator \\n            -destination 'generic/platform=iOS Simulator' \\n            -derivedDataPath DerivedData \\n            CODE_SIGNING_ALLOWED=NO \\n            build\n\n      - name: Select available iPhone simulator\n        id: simulator\n        run: |\n          UDID="$(python3 - <<'PY'\n          import json\n          import subprocess\n\n          payload = json.loads(\n              subprocess.check_output(\n                  ["xcrun", "simctl", "list", "devices", "available", "-j"],\n                  text=True,\n              )\n          )\n\n          for runtime in sorted(payload["devices"].keys(), reverse=True):\n              for device in payload["devices"][runtime]:\n                  if device.get("isAvailable") and device["name"].startswith("iPhone"):\n                      print(device["udid"])\n                      raise SystemExit(0)\n\n          raise SystemExit("No available iPhone simulator found")\n          PY\n          )"\n          echo "udid=$UDID" >> "$GITHUB_OUTPUT"\n          echo "Using simulator $UDID"\n\n      - name: Boot simulator\n        run: |\n          xcrun simctl boot "${{ steps.simulator.outputs.udid }}" || true\n          xcrun simctl bootstatus "${{ steps.simulator.outputs.udid }}" -b\n\n      - name: Run unit tests\n        run: |\n          xcodebuild \\n            -project WeatherApp.xcodeproj \\n            -scheme WeatherApp \\n            -configuration Debug \\n            -destination "id=${{ steps.simulator.outputs.udid }}" \\n            -derivedDataPath DerivedDataTests \\n            test\n\n      - name: Capture visual smoke screenshots\n        run: |\n          set -euo pipefail\n          UDID="${{ steps.simulator.outputs.udid }}"\n          APP_PATH="DerivedData/Build/Products/Debug-iphonesimulator/WeatherApp.app"\n          mkdir -p visual-smoke\n          xcrun simctl install "$UDID" "$APP_PATH"\n          xcrun simctl spawn "$UDID" defaults write com.columbuslabs.weatherapp hasCompletedWeatherOnboarding -bool YES\n\n          xcrun simctl ui "$UDID" appearance dark\n          for TAB in today forecast radar places; do\n            ARGS=()\n            if [ "$TAB" != "today" ]; then\n              ARGS+=("--weather-tab=$TAB")\n            fi\n            xcrun simctl launch --terminate-running-process "$UDID" com.columbuslabs.weatherapp "${ARGS[@]}"\n            sleep 2\n            xcrun simctl io "$UDID" screenshot "visual-smoke/${TAB}-dark.png"\n          done\n\n          xcrun simctl ui "$UDID" appearance light\n          xcrun simctl launch --terminate-running-process "$UDID" com.columbuslabs.weatherapp\n          sleep 2\n          xcrun simctl io "$UDID" screenshot "visual-smoke/today-light.png"\n\n      - name: Upload visual smoke screenshots\n        uses: actions/upload-artifact@v4\n        with:\n          name: visual-smoke\n          path: visual-smoke/*.png\n          if-no-files-found: error\n\n      - name: Shutdown simulator\n        if: always()\n        run: |\n          xcrun simctl shutdown "${{ steps.simulator.outputs.udid }}" || true\n