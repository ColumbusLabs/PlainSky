name: iOS Build

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ios-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app
        run: |
          xcodebuild \
            -project WeatherApp.xcodeproj \
            -scheme WeatherApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Select available iPhone simulator
        id: simulator
        run: |
          UDID="$(python3 - <<'PY'
          import json
          import subprocess

          payload = json.loads(
              subprocess.check_output(
                  ["xcrun", "simctl", "list", "devices", "available", "-j"],
                  text=True,
              )
          )

          preferred = ["iPhone 17 Pro Max", "iPhone 17 Pro", "iPhone 16 Pro Max", "iPhone 16 Pro"]
          devices = [
              device
              for runtime in sorted(payload["devices"].keys(), reverse=True)
              for device in payload["devices"][runtime]
              if device.get("isAvailable") and device["name"].startswith("iPhone")
          ]

          for name in preferred:
              for device in devices:
                  if device["name"] == name:
                      print(device["udid"])
                      raise SystemExit(0)

          if devices:
              print(devices[0]["udid"])
              raise SystemExit(0)

          raise SystemExit("No available iPhone simulator found")
          PY
          )"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Using simulator $UDID"

      - name: Run unit tests
        run: |
          xcodebuild \
            -project WeatherApp.xcodeproj \
            -scheme WeatherApp \
            -configuration Debug \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath DerivedDataTests \
            test

      - name: Prepare simulator for visual smoke test
        run: |
          UDID="${{ steps.simulator.outputs.udid }}"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          mkdir -p visual-smoke
          xcrun simctl install "$UDID" DerivedData/Build/Products/Debug-iphonesimulator/WeatherApp.app

      - name: Capture Today dark
        timeout-minutes: 2
        run: |
          UDID="${{ steps.simulator.outputs.udid }}"
          xcrun simctl ui "$UDID" appearance dark
          xcrun simctl launch --terminate-running-process "$UDID" com.columbuslabs.weatherapp --skip-onboarding --preview-data
          sleep 2
          xcrun simctl io "$UDID" screenshot visual-smoke/today-dark.png

      - name: Capture Forecast dark
        timeout-minutes: 2
        run: |
          UDID="${{ steps.simulator.outputs.udid }}"
          xcrun simctl launch --terminate-running-process "$UDID" com.columbuslabs.weatherapp --skip-onboarding --preview-data --weather-tab=forecast
          sleep 2
          xcrun simctl io "$UDID" screenshot visual-smoke/forecast-dark.png

      - name: Capture Radar dark
        timeout-minutes: 2
        run: |
          UDID="${{ steps.simulator.outputs.udid }}"
          xcrun simctl launch --terminate-running-process "$UDID" com.columbuslabs.weatherapp --skip-onboarding --weather-tab=radar
          sleep 8
          xcrun simctl io "$UDID" screenshot visual-smoke/radar-dark.png

      - name: Capture Places dark
        timeout-minutes: 2
        run: |
          UDID="${{ steps.simulator.outputs.udid }}"
          xcrun simctl launch --terminate-running-process "$UDID" com.columbuslabs.weatherapp --skip-onboarding --preview-data --weather-tab=places
          sleep 2
          xcrun simctl io "$UDID" screenshot visual-smoke/places-dark.png

      - name: Capture Today light
        timeout-minutes: 2
        run: |
          UDID="${{ steps.simulator.outputs.udid }}"
          xcrun simctl ui "$UDID" appearance light
          xcrun simctl launch --terminate-running-process "$UDID" com.columbuslabs.weatherapp --skip-onboarding
          sleep 2
          xcrun simctl io "$UDID" screenshot visual-smoke/today-light.png

      - name: Capture live NWS Today
        continue-on-error: true
        timeout-minutes: 2
        run: |
          UDID="${{ steps.simulator.outputs.udid }}"
          xcrun simctl ui "$UDID" appearance dark
          xcrun simctl launch --terminate-running-process "$UDID" com.columbuslabs.weatherapp --skip-onboarding --live-nws
          sleep 20
          xcrun simctl io "$UDID" screenshot visual-smoke/live-nws-today.png

      - name: Upload visual smoke screenshots
        uses: actions/upload-artifact@v4
        with:
          name: visual-smoke
          path: visual-smoke/*.png
          if-no-files-found: error

      - name: Shutdown simulator
        if: always()
        run: |
          xcrun simctl shutdown "${{ steps.simulator.outputs.udid }}" || true
